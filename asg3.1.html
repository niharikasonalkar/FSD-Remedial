<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Simple Task Manager</title>
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background-color: #fdf6f0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    margin: 0;
  }

  .app-container {
    background: #ffffff;
    margin-top: 60px;
    padding: 30px 25px;
    border-radius: 12px;
    width: 90%;
    max-width: 420px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
    text-align: center;
  }

  h1 {
    color: #5b5b8a;
    margin-bottom: 20px;
  }

  .task-form {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .task-form input {
    flex: 1;
    padding: 10px 12px;
    border: 1.5px solid #ccc;
    border-radius: 8px;
    font-size: 1rem;
    margin-right: 10px;
  }

  .task-form input:focus {
    outline: none;
    border-color: #a7c7e7;
    box-shadow: 0 0 4px #a7c7e7aa;
  }

  .task-form button {
    background-color: #b6e2d3;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    cursor: pointer;
    font-weight: 600;
    color: #2e4b3d;
    transition: background 0.3s ease;
  }

  .task-form button:hover {
    background-color: #a0d6c3;
  }

  ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }

  li {
    background: #f5f5fb;
    border-radius: 8px;
    padding: 12px 15px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background 0.3s ease;
  }

  li.done {
    text-decoration: line-through;
    color: #999;
    background: #e6e6fa;
  }

  .delete-btn {
    background: transparent;
    border: none;
    font-size: 18px;
    color: #e57373;
    cursor: pointer;
    transition: color 0.3s ease;
  }

  .delete-btn:hover {
    color: #d32f2f;
  }

  .empty {
    color: #888;
    font-style: italic;
  }

  /* Responsive */
  @media (max-width: 480px) {
    .app-container {
      width: 95%;
      padding: 20px;
    }
    .task-form input {
      font-size: 0.9rem;
    }
  }
</style>
</head>
<body>

<div class="app-container">
  <h1>🌿 My To-Do List</h1>

  <form class="task-form" id="taskForm">
    <input type="text" id="taskInput" placeholder="Enter a new task..." />
    <button type="submit">Add</button>
  </form>

  <ul id="taskList">
    <p class="empty">No tasks yet. Add one!</p>
  </ul>
</div>

<script>
  const form = document.getElementById("taskForm");
  const input = document.getElementById("taskInput");
  const list = document.getElementById("taskList");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    const taskText = input.value.trim();

    if (taskText === "") return;

    const li = document.createElement("li");
    li.innerHTML = `
      <span>${taskText}</span>
      <button class="delete-btn">✖</button>
    `;

    // Toggle complete
    li.querySelector("span").addEventListener("click", function () {
      li.classList.toggle("done");
    });

    // Delete task
    li.querySelector(".delete-btn").addEventListener("click", function () {
      li.remove();
      checkEmpty();
    });

    list.appendChild(li);
    input.value = "";
    checkEmpty();
  });

  function checkEmpty() {
    const tasks = list.querySelectorAll("li");
    const emptyMsg = list.querySelector(".empty");
    if (tasks.length === 0) {
      if (!emptyMsg) {
        const msg = document.createElement("p");
        msg.className = "empty";
        msg.textContent = "No tasks yet. Add one!";
        list.appendChild(msg);
      }
    } else {
      if (emptyMsg) emptyMsg.remove();
    }
  }
</script>

</body>
</html>
