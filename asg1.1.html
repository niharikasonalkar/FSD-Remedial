<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skincare Product Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f9f9f9;
      font-family: Arial, sans-serif;
    }

    .product-container {
      max-width: 600px;
      margin: 50px auto;
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
    }

    .product-image {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    h2 {
      color: #333;
      font-size: 1.8em;
    }

    p {
      color: #555;
      font-size: 0.95em;
    }

    .price {
      color: #3c8c72;
      font-size: 1.3em;
      font-weight: bold;
      margin: 10px 0;
    }

    .btn-add {
      background-color: #d5e8e4;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      color: #333;
      cursor: pointer;
    }

    .btn-add:hover {
      background-color: #c2dcd6;
    }

    footer {
      text-align: center;
      color: #777;
      font-size: 0.85em;
      margin-top: 30px;
    }
  </style>
</head>
<body>

  <div class="product-container">
    <img src="https://images.pexels.com/photos/5938242/pexels-photo-5938242.jpeg?auto=compress&cs=tinysrgb&w=800" alt="Serum Bottle" class="product-image">
    <h2>Hydrating Face Serum</h2>
    <p>This refreshing serum helps restore moisture and gives your skin a soft, radiant glow. Made with natural aloe and vitamin E.</p>
    <p class="price">₹749</p>

    <form>
      <label for="quantity">Quantity:</label>
      <input type="number" id="quantity" min="1" value="1" style="width: 60px; text-align:center; margin-left:5px;">
      <br><br>
      <label for="size">Select Size:</label>
      <select id="size">
        <option>30ml</option>
        <option>50ml</option>
        <option>100ml</option>
      </select>
      <br><br>
      <button type="submit" class="btn-add">Add to Cart</button>
    </form>
  </div>

  <footer>
    <p>Designed by Niharika</p>
  </footer>

</body>
</html>
